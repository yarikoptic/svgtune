name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            inkscape python3-lxml python3-pytest
      - name: Show versions
        run: inkscape --version
      - name: Run tests
        run: python3 -m pytest -v tests
