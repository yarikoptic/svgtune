name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            inkscape python3-lxml python3-pytest
      - name: Show versions
        run: inkscape --version
      - name: Run tests
        run: python3 -m pytest -v tests

  test-slides2svgtune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install lxml pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -v tests/test_slides2svgtune.py tests/test_svgtune.py
